<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8ECDEF">
  <title>Bubu & Dudu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Literata:opsz,wght@7..72,480;7..72,650&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16343c;
      --sheet: #f4fafb;
      --persimmon: #ff6b3d;
      --storm: #2f5d8c;
      --track: #d5e4ea;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Literata, Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.45;
      background: #8ecdef;
    }

    button, input { font: inherit; color: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--persimmon);
      outline-offset: 2px;
    }

    .app {
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .world {
      position: relative;
      flex: 0 0 auto;
      height: 44dvh;
      min-height: 250px;
      overflow: hidden;
      background: linear-gradient(#8ecdef, #d7f0b8);
    }

    body.playing .world {
      height: 30dvh;
      min-height: 176px;
    }

    body.playing .bear svg { width: 86px; height: 102px; }

    .titleblock {
      position: absolute;
      z-index: 4;
      top: calc(14px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      pointer-events: none;
    }

    .titleblock h1 {
      margin: 0;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: clamp(2.5rem, 11vw, 3.5rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .lead {
      margin: 2px 0 12px;
      font-size: 1.08rem;
    }

    .sun {
      position: absolute;
      z-index: 1;
      top: 58px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffe38a;
    }

    .clouds {
      position: absolute;
      z-index: 1;
      top: 68px;
      left: 0;
      width: 200%;
      height: 84px;
      animation: drift 48s linear infinite;
    }

    .clouds i {
      position: absolute;
      display: block;
      background: #fff;
      border-radius: 40px;
      opacity: 0.92;
    }

    .clouds i:nth-child(1),
    .clouds i:nth-child(4) { width: 86px; height: 30px; top: 8px; }
    .clouds i:nth-child(1) { left: 4%; }
    .clouds i:nth-child(4) { left: 54%; }
    .clouds i:nth-child(2),
    .clouds i:nth-child(5) { width: 48px; height: 20px; top: 34px; }
    .clouds i:nth-child(2) { left: 18%; }
    .clouds i:nth-child(5) { left: 68%; }
    .clouds i:nth-child(3),
    .clouds i:nth-child(6) { width: 68px; height: 24px; top: 6px; }
    .clouds i:nth-child(3) { left: 30%; }
    .clouds i:nth-child(6) { left: 80%; }

    .hills {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 48%;
    }

    .hill.far { fill: #8fce7a; }
    .hill.near { fill: #67a85e; }

    .fx {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    .fx i {
      position: absolute;
      top: -14%;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .fx[data-kind="motes"] i,
    .fx[data-kind="hearts"] i,
    .fx[data-kind="stars"] i,
    .fx[data-kind="steam"] i { border-radius: 50%; }

    .fx[data-kind="motes"] i { width: 7px; height: 7px; background: rgba(255, 255, 255, 0.85); animation-name: fall; }
    .fx[data-kind="hearts"] i { width: 9px; height: 9px; background: #ff6b3d; animation-name: rise; }
    .fx[data-kind="leaves"] i { width: 9px; height: 6px; background: #3f8a52; border-radius: 40% 0; animation-name: fall; }
    .fx[data-kind="rain"] i { width: 2px; height: 18px; background: rgba(255, 255, 255, 0.8); border-radius: 2px; animation-name: fall; }
    .fx[data-kind="steam"] i { width: 16px; height: 16px; background: rgba(255, 255, 255, 0.55); animation-name: rise; }
    .fx[data-kind="stars"] i { width: 4px; height: 4px; background: #fff; animation-name: twinkle; }

    .bubble {
      position: absolute;
      z-index: 6;
      max-width: 46%;
      margin: 0;
      padding: 6px 8px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 14px 14px 14px 4px;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 0.95rem;
      line-height: 1.15;
      animation: pop 0.28s ease;
    }

    .bubble:empty { display: none; }
    .bubble.bubu { left: 10px; bottom: 176px; }
    .bubble.dudu { right: 10px; bottom: 158px; border-radius: 14px 14px 4px 14px; }
    body.playing .bubble.bubu { bottom: 132px; }
    body.playing .bubble.dudu { bottom: 118px; }

    .cast {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 34px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 18px;
    }

    .bear {
      appearance: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
    }

    .bear::before {
      content: "";
      position: absolute;
      bottom: 26px;
      width: 74px;
      height: 14px;
      border-radius: 50%;
      background: rgba(22, 52, 60, 0.16);
    }

    .bear svg {
      position: relative;
      z-index: 1;
      width: 112px;
      height: 132px;
      display: block;
      animation: bob 3.4s ease-in-out infinite;
    }

    .bear.dudu svg { animation-delay: -1.5s; }

    .bear span {
      position: relative;
      z-index: 1;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
      background: var(--sheet);
      padding: 0 6px;
      border-radius: 4px;
    }

    .bear.is-mine span {
      background: var(--ink);
      color: var(--sheet);
    }

    .bear.is-turn span { outline: 2px solid var(--persimmon); }

    .bear.is-taken { opacity: 0.55; }

    .bear[data-pose="jump"] svg { animation: jump 0.7s ease-in-out infinite; }
    .bear[data-pose="sleep"] svg { animation: snooze 2.2s ease-in-out infinite; }
    .bear[data-pose="walk"] svg { animation: stride 0.55s ease-in-out infinite; }
    .bear[data-pose="laugh"] svg { animation: giggle 0.32s ease-in-out infinite; }
    .bear[data-pose="shy"] svg { animation: shy 1.5s ease-in-out infinite; }
    .bear[data-pose="eat"] svg,
    .bear[data-pose="talk"] svg { animation: nod 0.8s ease-in-out infinite; }
    .bear[data-pose="cook"] svg { animation: stir 0.45s ease-in-out infinite; }
    .bear[data-pose="sit"] svg { animation: settle 1.8s ease-in-out infinite; }
    .bear[data-pose="dance"] svg { animation: dance 0.65s ease-in-out infinite; }
    .bear[data-pose="storm"] svg { animation: shake 0.22s linear infinite; }
    .bear[data-pose="hug"] svg { animation: lean 0.8s ease-in-out infinite; }
    .cast[data-act="hug"] .bear.bubu { animation: meet-right 0.55s ease forwards; }
    .cast[data-act="hug"] .bear.dudu { animation: meet-left 0.55s ease forwards; }
    .cast[data-act="mad"] .bear.bubu { animation: sorry-back 0.55s ease forwards; }
    .cast[data-act="mad"] .bear.dudu { animation: turn-away 0.55s ease forwards; }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s infinite;
    }

    .bear.dudu .eye { animation-delay: -1.6s; }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      animation: rise-in 0.35s ease both;
    }

    .choice:nth-child(2) { animation-delay: 0.06s; }
    .choice:nth-child(3) { animation-delay: 0.12s; }

    .choice small {
      font-family: Literata, Georgia, serif;
      font-size: 0.92rem;
      font-weight: 480;
      line-height: 1.3;
    }

    .log { margin: 0 0 12px; padding-left: 1.1rem; }
    .log li { margin: 0 0 6px; }

    .world.enter { animation: scene-in 0.45s ease; }

    .sheet {
      position: relative;
      z-index: 5;
      flex: 1;
      min-height: 0;
      margin-top: -22px;
      padding: 18px 18px calc(16px + env(safe-area-inset-bottom));
      overflow: auto;
      background: var(--sheet);
      border-top: 3px solid var(--ink);
      border-radius: 28px 28px 0 0;
    }

    .lang {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 8px;
    }

    .lang button {
      min-height: 36px;
      padding: 0 10px;
      border: 2px solid var(--ink);
      background: transparent;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .lang button + button { margin-left: -2px; }

    .lang button.is-on {
      background: var(--ink);
      color: var(--sheet);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin: 0 0 8px;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .hud-row p { margin: 0; }

    .meters { display: grid; gap: 6px; }

    .meter {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 8px;
    }

    .meter span { font-size: 0.98rem; }

    .track {
      height: 10px;
      background: var(--track);
      border-radius: 4px;
      overflow: hidden;
    }

    .track div { height: 100%; width: 0; }
    #loveFill { background: var(--persimmon); }
    #chaosFill { background: var(--storm); }

    .notice {
      margin: 10px 0 0;
      color: #8d341c;
    }

    h2 {
      margin: 14px 0 6px;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .count { margin: 0 0 8px; color: #24515c; }

    .story { margin: 0 0 12px; font-size: 1.12rem; line-height: 1.5; }

    .recap { margin: 0 0 12px; color: #24515c; white-space: pre-line; }

    .wait { margin: 0 0 10px; }

    .choices { display: grid; gap: 8px; }

    .choice, .go {
      min-height: 52px;
      border-radius: 12px;
      border: 2px solid var(--ink);
    }

    .choice {
      padding: 10px 12px;
      text-align: left;
      background: #fff;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .choice:active { transform: translateY(1px); }

    .choice.is-selected, .choice:disabled.is-selected {
      background: var(--ink);
      color: var(--sheet);
    }

    .go {
      width: 100%;
      margin-top: 8px;
      background: var(--ink);
      color: var(--sheet);
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .go.alt { background: var(--sheet); color: var(--ink); }

    .go:disabled, .choice:disabled { opacity: 0.45; cursor: default; }

    .choice:disabled.is-selected { opacity: 1; }

    .join-row { display: flex; gap: 8px; margin-top: 8px; }

    .join-row input {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      padding: 0 12px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
    }

    .join-row .go { width: auto; min-width: 96px; margin-top: 0; }

    label { display: block; margin-top: 14px; }

    .code {
      margin: 4px 0 0;
      text-align: center;
      font-family: "Baloo 2", "Trebuchet MS", sans-serif;
      font-size: clamp(2.3rem, 14vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      user-select: text;
    }

    .texty {
      display: block;
      margin: 14px auto 0;
      padding: 8px;
      border: 0;
      background: none;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-family: Literata, Georgia, serif;
    }

    .error { margin: 12px 0 0; color: #8d341c; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    body[data-mood="morning"] { background: #8ecdef; }
    body[data-mood="kitchen"] { background: #f2c48a; }
    body[data-mood="park"] { background: #79c7ea; }
    body[data-mood="crisis"] { background: #9aabb8; }
    body[data-mood="dusk"] { background: #f2b56b; }
    body[data-mood="night"] { background: #24556c; }

    .world[data-mood="morning"] { background: linear-gradient(#8ecdef, #d7f0b8); }
    .world[data-mood="kitchen"] { background: linear-gradient(#f2c48a, #ffe7c2); }
    .world[data-mood="park"] { background: linear-gradient(#79c7ea, #b7e3a1); }
    .world[data-mood="crisis"] { background: linear-gradient(#9aabb8, #d5dee6); }
    .world[data-mood="dusk"] { background: linear-gradient(#f2b56b, #1e4c68); }
    .world[data-mood="night"] { background: linear-gradient(#24556c, #102833); }

    .world[data-mood="kitchen"] .hill.far { fill: #e7b07a; }
    .world[data-mood="kitchen"] .hill.near { fill: #c98455; }
    .world[data-mood="kitchen"] .sun { background: #fff4d2; }
    .world[data-mood="park"] .hill.far { fill: #67b86a; }
    .world[data-mood="park"] .hill.near { fill: #3f8a52; }
    .world[data-mood="crisis"] .hill.far { fill: #b7c3cc; }
    .world[data-mood="crisis"] .hill.near { fill: #8ea0ad; }
    .world[data-mood="crisis"] .sun { background: #e7eef2; }
    .world[data-mood="dusk"] .hill.far { fill: #c98455; }
    .world[data-mood="dusk"] .hill.near { fill: #17384c; }
    .world[data-mood="dusk"] .sun { top: auto; bottom: 78px; background: #ffd0a1; }
    .world[data-mood="night"] .hill.far { fill: #1b4458; }
    .world[data-mood="night"] .hill.near { fill: #0f2c3a; }
    .world[data-mood="night"] .sun { background: #f4f7fb; width: 36px; height: 36px; }
    .world[data-mood="night"] .clouds { opacity: 0.35; }

    body[data-mood="room"], .world[data-mood="room"] { background: #f2c9a0; }
    .world[data-mood="room"] { background: linear-gradient(#f6d7b0, #e7b089); }
    .world[data-mood="room"] .hill.far { fill: #d7a06a; }
    .world[data-mood="room"] .hill.near { fill: #c48455; }
    .world[data-mood="room"] .sun { background: #fff1c9; }

    body[data-mood="street"] { background: #7ec8ea; }
    .world[data-mood="street"] { background: linear-gradient(#8fd0ef, #f2d48a); }
    .world[data-mood="street"] .hill.far { fill: #8fb56a; }
    .world[data-mood="street"] .hill.near { fill: #5c8f55; }

    body[data-mood="supper"] { background: #e28b62; }
    .world[data-mood="supper"] { background: linear-gradient(#f0a36a, #6d3b4a); }
    .world[data-mood="supper"] .hill.far { fill: #c46b4a; }
    .world[data-mood="supper"] .hill.near { fill: #4a2c38; }
    .world[data-mood="supper"] .sun { top: auto; bottom: 72px; background: #ffd0a1; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes hop {
      0% { transform: translateY(0); }
      40% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-26px) scale(1.05); }
    }

    @keyframes snooze {
      0%, 100% { transform: translateY(10px) rotate(-8deg); }
      50% { transform: translateY(14px) rotate(-3deg); }
    }

    @keyframes stride {
      0%, 100% { transform: translateX(-10px) rotate(-6deg); }
      50% { transform: translateX(10px) rotate(6deg); }
    }

    @keyframes giggle {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg) translateY(-6px); }
    }

    @keyframes shy {
      0%, 100% { transform: translateX(0) scale(1); }
      50% { transform: translateX(-12px) scale(0.92); }
    }

    @keyframes nod {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(7px) rotate(4deg); }
    }

    @keyframes stir {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(12deg) translateY(-4px); }
    }

    @keyframes settle {
      0%, 100% { transform: translateY(6px) scale(1, 0.96); }
      50% { transform: translateY(8px) scale(1.02, 0.94); }
    }

    @keyframes dance {
      0% { transform: translateY(0) rotate(-10deg); }
      50% { transform: translateY(-18px) rotate(10deg); }
      100% { transform: translateY(0) rotate(-10deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px) rotate(-3deg); }
      75% { transform: translateX(7px) rotate(3deg); }
    }

    @keyframes lean {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes meet-right { to { transform: translateX(26px); } }
    @keyframes meet-left { to { transform: translateX(-26px); } }
    @keyframes sorry-back { to { transform: translateX(-14px) scale(0.94); } }
    @keyframes turn-away { to { transform: translateX(22px) rotate(8deg); } }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      93% { transform: scaleY(0.12); }
    }

    @keyframes fall { to { transform: translateY(140vh) rotate(80deg); } }
    @keyframes rise { from { transform: translateY(46vh); } to { transform: translateY(-12vh); } }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: translateY(30vh); }
      50% { opacity: 1; transform: translateY(18vh); }
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes rise-in {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    @keyframes scene-in {
      from { transform: translateY(10px); }
      to { transform: none; }
    }

    @media (max-height: 700px) {
      .world { min-height: 210px; }
      .bear svg { width: 96px; height: 114px; }
      .titleblock h1 { font-size: 2.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .clouds, .bear svg, .fx i, .bubble, .choice, .world.enter,
      .cast[data-act="hug"] .bear, .cast[data-act="mad"] .bear, .eye { animation: none; }
      .track div { transition: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .track div { transition: width 480ms ease; }
    }
  </style>
</head>
<body data-mood="morning">
  <div class="app">
    <div class="world" id="world" data-mood="morning">
      <div class="sun" aria-hidden="true"></div>
      <div class="clouds" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="fx" id="fx" data-kind="motes" aria-hidden="true"></div>
      <div class="titleblock" id="titleblock">
        <h1>Bubu & Dudu</h1>
      </div>
      <svg class="hills" viewBox="0 0 400 140" preserveAspectRatio="none" aria-hidden="true">
        <path class="hill far" d="M0 78 C70 36 150 58 210 70 C280 86 330 40 400 62 L400 140 L0 140 Z"></path>
        <path class="hill near" d="M0 104 C70 78 130 96 210 102 C290 110 340 84 400 98 L400 140 L0 140 Z"></path>
      </svg>
      <div class="cast">
        <button type="button" class="bear bubu" id="bearBubu">
          <svg viewBox="0 0 120 150" aria-hidden="true">
            <circle cx="34" cy="32" r="16" fill="#16343c"></circle>
            <circle cx="86" cy="32" r="16" fill="#16343c"></circle>
            <circle cx="60" cy="58" r="36" fill="#fff"></circle>
            <ellipse cx="46" cy="56" rx="13" ry="15" fill="#16343c"></ellipse>
            <ellipse cx="74" cy="56" rx="13" ry="15" fill="#16343c"></ellipse>
            <circle class="eye" cx="48" cy="54" r="4" fill="#fff"></circle>
            <circle class="eye" cx="76" cy="54" r="4" fill="#fff"></circle>

          return;
        }
        if (inSession()) failHard();
        else failSoft("connect-fail");
      }

      function bindConn(c, gen) {
        conn = c;
        c.on("data", function (msg) {
          if (gen !== generation) return;
          connReady = true;
          if (state.isHost) onGuestMessage(msg);
          else onSnapshot(msg);
        });
        c.on("open", function () {
          if (gen !== generation) return;
          connReady = true;
          if (state.isHost) sendSnapshot();
          else c.send({ t: "hello" });
        });
        c.on("close", function () {
          if (gen !== generation || suppressClose) return;
          if (conn !== c) return;
          handleDrop();
        });
        c.on("error", function () {
          if (gen !== generation || suppressClose) return;
          if (conn !== c) return;
          handleDrop();
        });
      }

      function onGuestMessage(msg) {
        if (!msg || typeof msg !== "object") return;
        if (msg.t === "hello") {
          state = hostReduce(state, { type: "partner" });
          publish();
          return;
        }
        if (!state.partner) return;
        if (msg.t === "role" && (msg.role === "bubu" || msg.role === "dudu")) {
          state = hostReduce(state, { type: "role", seat: "guest", role: msg.role });
        } else if (msg.t === "ready") {
          state = hostReduce(state, { type: "ready", seat: "guest" });
        } else if (msg.t === "choice" && typeof msg.id === "string") {
          state = hostReduce(state, { type: "choice", seat: "guest", id: msg.id });
        } else if (msg.t === "continue") {
          state = hostReduce(state, { type: "continue", seat: "guest" });
        } else if (msg.t === "restart") {
          state = hostReduce(state, { type: "restart" });
        } else return;
        publish();
      }

      function onSnapshot(msg) {
        if (!msg || msg.t !== "state" || typeof msg.seq !== "number") return;
        if (!msg.roles || !msg.ready || !msg.picks || !msg.continues) return;
        if (msg.seq < state.seq) return;
        window.clearTimeout(netTimer);
        state.phase = msg.phase;
        state.code = msg.code || state.code;
        state.roles = { bubu: msg.roles.bubu, dudu: msg.roles.dudu };
        state.ready = { host: !!msg.ready.host, guest: !!msg.ready.guest };
        state.sceneIndex = msg.sceneIndex;
        state.love = msg.love;
        state.chaos = msg.chaos;
        state.picks = { bubu: msg.picks.bubu, dudu: msg.picks.dudu };
        state.continues = { host: !!msg.continues.host, guest: !!msg.continues.guest };
        state.outcomeText = msg.outcomeText || "";
        state.endingId = msg.endingId;
        state.act = msg.act || "";
        state.shift = msg.shift ? { love: msg.shift.love, chaos: msg.shift.chaos } : null;
        state.log = Array.isArray(msg.log) ? msg.log.map(function (item) { return { t: item.t, b: item.b, d: item.d }; }) : [];
        state.notice = msg.notice || "";
        state.partner = true;
        state.isHost = false;
        state.seat = "guest";
        state.seq = msg.seq;
        state.error = msg.phase === "disconnected" ? "rejoin" : "";
        const role = roleOf(state, "guest");
        if (role && state.picks[role]) localChoice = null;
        else if (state.phase !== "scene") localChoice = null;
        if (!state.ready.guest) localReady = false;
        if (state.continues.guest || state.phase !== "outcome") localCont = false;
        render();
      }

      function startHost(isRetry) {
        const Ctor = peerCtor();
        if (!Ctor) {
          failSoft("no-lib");
          return;
        }
        destroyNet();
        const gen = generation;
        if (!isRetry) startHost.retries = 0;
        const code = randomCode();
        state = initialState();
        state.phase = "opening";
        render();
        peer = new Ctor("bd" + code);
        netTimer = window.setTimeout(function () {
          if (gen !== generation) return;
          if (state.phase === "opening") failSoft("slow-server");
        }, 15000);
        peer.on("open", function () {
          if (gen !== generation) return;
          window.clearTimeout(netTimer);
          state = hostReduce(initialState(), { type: "hosted", code: code });
          publish();
        });
        peer.on("connection", function (c) {
          if (gen !== generation) {
            c.close();
            return;
          }
          if (conn) {
            c.close();
            return;
          }
          bindConn(c, gen);
        });
        peer.on("error", function (err) {
          if (gen !== generation) return;
          if (err && err.type === "unavailable-id" && startHost.retries < 4) {
            startHost.retries += 1;
            startHost(true);
            return;
          }
          onPeerError(err, gen, false);
        });
      }
      startHost.retries = 0;

      function startGuest(code) {
        const Ctor = peerCtor();
        if (!Ctor) {
          failSoft("no-lib");
          return;
        }
        destroyNet();
        const gen = generation;
        state = initialState();
        state.phase = "joining";
        state.code = code;
        state.seat = "guest";
        render();
        peer = new Ctor();
        netTimer = window.setTimeout(function () {
          if (gen !== generation) return;
          if (state.phase === "joining") {
            failSoft("no-room-timeout");
          }
        }, 15000);
        peer.on("open", function () {
          if (gen !== generation) return;
          const c = peer.connect("bd" + code, { serialization: "json", reliable: true });
          if (!c) return;
          bindConn(c, gen);
        });
        peer.on("connection", function (incoming) {
          incoming.close();
        });
        peer.on("error", function (err) {
          onPeerError(err, gen, false);
        });
      }

      function sendGuest(payload) {
        if (!conn || !connReady) return;
        conn.send(payload);
      }

      function pickRole(role) {
        if (state.phase !== "role") return;
        const taken = state.roles[role];
        if (taken && taken !== state.seat) return;
        if (state.isHost) {
          state = hostReduce(state, { type: "role", seat: "host", role: role });
          publish();
        } else {
          sendGuest({ t: "role", role: role });
        }
      }

      function pressReady() {
        if (state.phase !== "role") return;
        if (!roleOf(state, state.seat)) return;
        if (state.isHost) {
          state = hostReduce(state, { type: "ready", seat: "host" });
          publish();
        } else {
          localReady = true;
          render();
          sendGuest({ t: "ready" });
        }
      }

      function choose(id) {
        if (state.phase !== "scene") return;
        const role = roleOf(state, state.seat);
        if (!role || state.picks[role] || localChoice) return;
        if (state.isHost) {
          state = hostReduce(state, { type: "choice", seat: "host", id: id });
          publish();
        } else {
          localChoice = id;
          render();
          sendGuest({ t: "choice", id: id });
        }
      }

      function pressContinue() {
        if (state.phase !== "outcome") return;
        if (state.continues[state.seat] || localCont) return;
        if (state.isHost) {
          state = hostReduce(state, { type: "continue", seat: "host" });
          publish();
        } else {
          localCont = true;
          render();
          sendGuest({ t: "continue" });
        }
      }

      function pressRestart() {
        if (state.phase !== "ending") return;
        if (state.isHost) {
          state = hostReduce(state, { type: "restart" });
          publish();
        } else sendGuest({ t: "restart" });
      }

      function leaveRoom() {
        destroyNet();
        state = initialState();
        localChoice = null;
        localCont = false;
        localReady = false;
        render();
      }

      function partnerSeat() {
        return state.seat === "host" ? "guest" : "host";
      }

      function roleName(role) {
        if (role === "bubu") return "Bubu";
        if (role === "dudu") return "Dudu";
        return "Partner";
      }

      function say(line) {
        if (els.live.textContent !== line) els.live.textContent = line;
      }

      function show(el, on) {
        el.hidden = !on;
      }

      function poseName(id, phase) {
        if (phase === "outcome") {
          if (state.act === "hug") return "hug";
          if (state.act === "storm") return "storm";
          if (state.act === "dance") return "dance";
          if (state.act === "laugh") return "laugh";
        }
        if (id && POSE[id]) return POSE[id];
        if (phase === "lobby" || phase === "opening" || phase === "hosting" || phase === "joining") return "idle";
        return "idle";
      }

      function bubbleText(role, id, phase, scene) {
        const meta = metaOf(scene.id);
        if (phase === "ending" && state.endingId === "kaos") {
          return role === "dudu" ? ui("mad-dudu") : ui("mad-bubu");
        }
        if (phase === "lobby" || phase === "opening" || phase === "hosting" || phase === "joining") {
          return role === "bubu" ? ui("bubble-play") : ui("bubble-wait");
        }
        if (phase === "role") return role === "bubu" ? ui("bubble-me") : ui("bubble-or");
        if ((phase === "scene" || phase === "outcome") && id && sayOf(id)) return sayOf(id);
        if (phase === "scene" || phase === "outcome" || phase === "ending") {
          return role === "bubu" ? (meta.bubuSay || "") : (meta.duduSay || "");
        }
        return "";
      }

      function shown(code) {
        return ui(code);
      }

      function applyChrome() {
        document.documentElement.lang = lang === "de" ? "de" : "tr";
        els.langSwitch.setAttribute("aria-label", ui("language"));
        els.langTr.classList.toggle("is-on", lang === "tr");
        els.langDe.classList.toggle("is-on", lang === "de");
        els.langTr.setAttribute("aria-pressed", lang === "tr" ? "true" : "false");
        els.langDe.setAttribute("aria-pressed", lang === "de" ? "true" : "false");
        els.leadText.textContent = ui("lead");
        els.codeLabel.textContent = ui("room-code");
        els.joinBtn.textContent = ui("join");
        els.hostTitle.textContent = ui("room-ready");
        els.hostHelp.textContent = ui("share-code");
        els.hostWait.textContent = ui("waiting-partner");
        els.joinTitle.textContent = ui("connecting-title");
        els.joinStatus.textContent = ui("connecting");
        els.roleTitle.textContent = ui("pick-role-title");
        els.roleHelp.textContent = ui("two-bears");
        els.restartBtn.textContent = ui("replay");
        els.downTitle.textContent = ui("disconnected-title");
        els.downText.textContent = ui("rejoin");
        els.downBtn.textContent = ui("new-room");
        els.loveName.textContent = ui("love");
        els.chaosName.textContent = ui("chaos");
        els.loveMeter.setAttribute("aria-label", ui("love"));
        els.chaosMeter.setAttribute("aria-label", ui("chaos"));
        if (!copyFlash) els.copyBtn.textContent = ui("copy");
        els.codeInput.placeholder = lang === "de" ? "6 Ziffern" : "6 hane";
      }

      function fxFor(mood, act) {
        if (act === "storm" || mood === "crisis") return "rain";
        if (act === "hug" || act === "laugh") return "hearts";
        if (act === "dance") return "leaves";
        if (mood === "kitchen" || mood === "room" || mood === "supper") return "steam";
        if (mood === "park" || mood === "street") return "leaves";
        if (mood === "night" || mood === "dusk") return "stars";
        return "motes";
      }

      function paintFx(kind) {
        if (!els.fx || fxKind === kind) return;
        fxKind = kind;
        els.fx.dataset.kind = kind;
        while (els.fx.firstChild) els.fx.removeChild(els.fx.firstChild);
        for (let i = 0; i < 14; i += 1) {
          const dot = document.createElement("i");
          dot.style.left = (4 + i * 6.6) + "%";
          dot.style.animationDelay = (-i * 0.32) + "s";
          dot.style.animationDuration = (kind === "rain" ? 0.85 : 3.4) + (i % 4) * 0.35 + "s";
          els.fx.appendChild(dot);
        }
      }

      function render() {
        applyChrome();
        const phase = state.phase;
        const myRole = roleOf(state, state.seat);
        const scene = SCENES[state.sceneIndex] || SCENES[0];
        let mood = "morning";
        if (phase === "scene" || phase === "outcome") mood = scene.mood;
        if (phase === "ending" && ENDINGS[state.endingId]) mood = ENDINGS[state.endingId].mood;
        document.body.dataset.mood = mood;
        els.world.dataset.mood = mood;
        if (shownScene !== scene.id + phase) {
          shownScene = scene.id + phase;
          els.world.classList.remove("enter");
          void els.world.offsetWidth;
          els.world.classList.add("enter");
        }
        const bubuPick = state.picks.bubu || (myRole === "bubu" ? localChoice : null);
        const duduPick = state.picks.dudu || (myRole === "dudu" ? localChoice : null);
        els.bearBubu.dataset.pose = phase === "role" && myRole === "bubu" ? "jump" : poseName(phase === "scene" || phase === "outcome" ? bubuPick : "", phase);
        els.bearDudu.dataset.pose = phase === "role" && myRole === "dudu" ? "jump" : poseName(phase === "scene" || phase === "outcome" ? duduPick : "", phase);
        const intro = phase === "lobby" || phase === "hosting" || phase === "joining" || phase === "opening";
        if (intro) {
          els.bearBubu.dataset.pose = "jump";
          els.bearDudu.dataset.pose = "sleep";
        }
        els.bearBubuName.textContent = intro ? "Bubu (Meli)" : "Bubu";
        els.bearDuduName.textContent = intro ? "Dudu (Uğur)" : "Dudu";
        if (phase === "ending" && state.endingId === "kaos") {
          els.bearBubu.dataset.pose = "shy";
          els.bearDudu.dataset.pose = "storm";
        }
        if (els.cast) {
          if (phase === "ending" && state.endingId === "kaos") els.cast.dataset.act = "mad";
          else els.cast.dataset.act = phase === "outcome" ? (state.act || "") : "";
        }
        els.bubbleBubu.textContent = bubbleText("bubu", bubuPick, phase, scene);
        els.bubbleDudu.textContent = bubbleText("dudu", duduPick, phase, scene);
        const stageAct = phase === "ending" && state.endingId === "kaos" ? "storm" : (phase === "outcome" || phase === "ending" ? state.act : "");
        paintFx(fxFor(mood, stageAct));
        if (els.theme) els.theme.setAttribute("content", THEME[mood] || THEME.morning);
        document.body.classList.toggle("playing", phase === "scene" || phase === "outcome" || phase === "ending");
        show(els.titleblock, phase === "lobby" || phase === "opening" || phase === "hosting" || phase === "joining");

        const bubuTaken = state.roles.bubu && state.roles.bubu !== state.seat;
        const duduTaken = state.roles.dudu && state.roles.dudu !== state.seat;
        els.bearBubu.classList.toggle("is-mine", phase === "role" && myRole === "bubu");
        els.bearDudu.classList.toggle("is-mine", phase === "role" && myRole === "dudu");
        els.bearBubu.classList.toggle("is-taken", !!bubuTaken && phase === "role");
        els.bearDudu.classList.toggle("is-taken", !!duduTaken && phase === "role");
        els.bearBubu.classList.toggle("is-turn", phase === "scene" && myRole === "bubu" && !state.picks.bubu && !localChoice);
        els.bearDudu.classList.toggle("is-turn", phase === "scene" && myRole === "dudu" && !state.picks.dudu && !localChoice);
        const roleClickable = phase === "role";
        els.bearBubu.setAttribute("aria-disabled", roleClickable && !bubuTaken ? "false" : "true");
        els.bearDudu.setAttribute("aria-disabled", roleClickable && !duduTaken ? "false" : "true");
        els.bearBubu.setAttribute("aria-pressed", myRole === "bubu" ? "true" : "false");
        els.bearDudu.setAttribute("aria-pressed", myRole === "dudu" ? "true" : "false");
        els.bearBubu.tabIndex = roleClickable && !bubuTaken ? 0 : -1;
        els.bearDudu.tabIndex = roleClickable && !duduTaken ? 0 : -1;

        if (phase === "outcome" && lastPhase !== "outcome" && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          els.bearBubu.classList.add("hop");
          els.bearDudu.classList.add("hop");
          window.clearTimeout(hopTimer);
          hopTimer = window.setTimeout(function () {
            els.bearBubu.classList.remove("hop");
            els.bearDudu.classList.remove("hop");
          }, 520);
        }
        lastPhase = phase;

        const hudOn = phase === "role" || phase === "scene" || phase === "outcome" || phase === "ending";
        show(els.hud, hudOn);
        if (hudOn) {
          els.hudWho.textContent = myRole ? (lang === "de" ? "Du bist " + roleName(myRole) : "Sen " + roleName(myRole) + "'sun") : ui("hud-pick");
          els.hudRoom.textContent = state.code ? ui("room") + " " + state.code : "";
          els.loveFill.style.width = clamp(state.love) + "%";
          els.chaosFill.style.width = clamp(state.chaos) + "%";
          els.loveMeter.setAttribute("aria-valuenow", String(clamp(state.love)));
          els.chaosMeter.setAttribute("aria-valuenow", String(clamp(state.chaos)));
          if (state.notice) {
            els.notice.hidden = false;
            els.notice.textContent = shown(state.notice);
          } else {
            els.notice.hidden = true;
            els.notice.textContent = "";
          }
        }

        show(els.panelLobby, phase === "lobby" || phase === "opening");
        show(els.panelHost, phase === "hosting");
        show(els.panelJoin, phase === "joining");
        show(els.panelRole, phase === "role");
        show(els.panelPlay, phase === "scene" || phase === "outcome");
        show(els.panelEnd, phase === "ending");
        show(els.panelDown, phase === "disconnected");
        show(els.leaveBtn, phase === "hosting" || phase === "joining" || phase === "role" || phase === "scene" || phase === "outcome" || phase === "ending");
        els.leaveBtn.textContent = phase === "hosting" || phase === "joining" ? ui("cancel") : ui("leave");

        els.hostBtn.disabled = phase === "opening";
        els.hostBtn.textContent = phase === "opening" ? ui("opening") : ui("open");
        els.joinBtn.disabled = phase === "opening";
        els.codeInput.disabled = phase === "opening";
        if (state.error && (phase === "lobby" || phase === "opening")) {
          els.lobbyError.hidden = false;
          els.lobbyError.textContent = shown(state.error);
        } else {
          els.lobbyError.hidden = true;
        }

        if (phase === "hosting") els.roomCode.textContent = state.code;

        if (phase === "role") {
          const other = partnerSeat();
          const otherRole = roleOf(state, other);
          let status = ui("no-role-yet");
          if (otherRole && state.ready[other]) status = lang === "de" ? roleName(otherRole) + " ist bereit." : roleName(otherRole) + " hazır.";
          else if (otherRole) status = lang === "de" ? roleName(otherRole) + " ist gewählt, noch nicht bereit." : roleName(otherRole) + " seçildi, henüz hazır değil.";
          els.roleStatus.textContent = status;
          const iReady = !!(state.ready[state.seat] || localReady);
          els.readyBtn.disabled = !myRole || iReady;
          els.readyBtn.textContent = iReady ? ui("ready-done") : ui("ready");
        }

        if (phase === "scene" || phase === "outcome") {
          const meta = metaOf(scene.id);
          els.sceneTitle.textContent = sceneTitle(scene);
          els.scenePlace.textContent = meta.clock ? meta.clock + "  " + meta.place : "";
          els.sceneCount.textContent = ui("scene") + " " + (state.sceneIndex + 1) + " / " + SCENES.length;
          const chosenId = (myRole && state.picks[myRole]) || localChoice;
          if (phase === "outcome") {
            const outcomeKey = state.picks.bubu + "|" + state.picks.dudu;
            const outcomeResult = scene.resolve[outcomeKey];
            els.storyText.textContent = resultText(scene, outcomeKey, outcomeResult ? outcomeResult.text : state.outcomeText);
            if (state.shift) {
              els.shiftText.hidden = false;
              if (state.shift.chaos > state.shift.love) els.shiftText.textContent = ui("shift-chaos");
              else if (state.shift.love > state.shift.chaos + 4) els.shiftText.textContent = ui("shift-love");
              else els.shiftText.textContent = ui("shift-both");
            } else els.shiftText.hidden = true;
            const bubuLabel = optionLabel(scene, "bubu", state.picks.bubu);
            const duduLabel = optionLabel(scene, "dudu", state.picks.dudu);
            els.recap.hidden = false;
            els.recap.textContent = "Bubu: " + bubuLabel + "\nDudu: " + duduLabel;
            show(els.choices, false);
            show(els.continueBtn, true);
            const iCont = !!(state.continues[state.seat] || localCont);
            const otherCont = !!state.continues[partnerSeat()];
            els.continueBtn.disabled = iCont;
            els.continueBtn.textContent = iCont ? ui("waiting") : ui("cont");
            let wait = "";
            const otherName = roleName(roleOf(state, partnerSeat()));
            if (iCont && !otherCont) wait = lang === "de" ? otherName + " soll noch auf Weiter tippen." : otherName + " devam etmeyi bekliyor.";
            else if (!iCont && otherCont) wait = lang === "de" ? otherName + " ist soweit. Du kannst weiter." : otherName + " hazır. Devam edebilirsin.";
            if (wait) {
              els.waitText.hidden = false;
              els.waitText.textContent = wait;
            } else els.waitText.hidden = true;
          } else {
            els.storyText.textContent = sceneNarration(scene);
            els.shiftText.hidden = true;
            els.recap.hidden = true;
            show(els.continueBtn, false);
            show(els.choices, true);
            const options = myRole ? scene[myRole] : [];
            while (els.choices.firstChild) els.choices.removeChild(els.choices.firstChild);
            for (let i = 0; i < options.length; i += 1) {
              const opt = options[i];
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "choice" + (chosenId === opt.id ? " is-selected" : "");
              btn.dataset.id = opt.id;
              const name = document.createElement("span");
              name.className = "choice-label";
              name.textContent = optionLabel(scene, myRole, opt.id);
              btn.appendChild(name);
              const hint = hintOf(myRole, opt.id);
              if (hint) {
                const small = document.createElement("small");
                small.textContent = hint;
                btn.appendChild(small);
              }
              btn.disabled = !!chosenId;
              els.choices.appendChild(btn);
            }
            const partnerRole = myRole === "bubu" ? "dudu" : myRole === "dudu" ? "bubu" : null;
            let wait = "";
            if (!myRole) wait = ui("no-role-here");
            else if (chosenId && partnerRole && !state.picks[partnerRole]) wait = lang === "de" ? roleName(partnerRole) + " wählt noch." : roleName(partnerRole) + " seçiyor.";
            else if (!chosenId && partnerRole && state.picks[partnerRole]) wait = lang === "de" ? roleName(partnerRole) + " ist fertig. Du bist dran." : roleName(partnerRole) + " seçimini yaptı. Sıra sende.";
            if (wait) {
              els.waitText.hidden = false;
              els.waitText.textContent = wait;
            } else els.waitText.hidden = true;
          }
        }

        if (phase === "ending") {
          const ending = endingOf(state.endingId);
          els.endTitle.textContent = ending.title;
          els.endText.textContent = ending.text;
          while (els.dayLog.firstChild) els.dayLog.removeChild(els.dayLog.firstChild);
          const items = state.log || [];
          for (let i = 0; i < items.length; i += 1) {
            const logged = sceneById(items[i].id);
            const li = document.createElement("li");
            if (logged) li.textContent = sceneTitle(logged) + ": Bubu " + optionLabel(logged, "bubu", items[i].b) + ", Dudu " + optionLabel(logged, "dudu", items[i].d);
            else li.textContent = (items[i].t || "") + ": Bubu " + (items[i].b || "") + ", Dudu " + (items[i].d || "");
            els.dayLog.appendChild(li);
          }
        }

        if (phase === "disconnected") {
          els.downText.textContent = state.error ? shown(state.error) : ui("rejoin");
        }

        let liveLine = "";
        if (phase === "hosting") liveLine = ui("live-host") + " " + state.code + ". " + ui("live-wait");
        else if (phase === "joining") liveLine = ui("connecting");
        else if (phase === "role") liveLine = els.roleStatus.textContent;
        else if (phase === "scene") liveLine = sceneNarration(scene);
        else if (phase === "outcome") liveLine = els.storyText.textContent;
        else if (phase === "ending") liveLine = endingOf(state.endingId).text;
        else if (phase === "disconnected") liveLine = els.downText.textContent;
        else if (state.error) liveLine = state.error;
        say(liveLine);
      }

      els.hostBtn.addEventListener("click", function () { startHost(false); });
      els.joinForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const code = els.codeInput.value.replace(/\D/g, "").slice(0, 6);
        els.codeInput.value = code;
        if (!/^\d{6}$/.test(code)) {
          state.error = "code-length";
          render();
          return;
        }
        startGuest(code);
      });
      els.codeInput.addEventListener("input", function () {
        els.codeInput.value = els.codeInput.value.replace(/\D/g, "").slice(0, 6);
      });
      els.copyBtn.addEventListener("click", function () {
        const done = function (ok) {
          copyFlash = true;
          els.copyBtn.textContent = ok ? ui("copied") : ui("copy-manual");
          window.setTimeout(function () {
            copyFlash = false;
            els.copyBtn.textContent = ui("copy");
          }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(state.code).then(function () { done(true); }).catch(function () { done(false); });
        } else done(false);
      });
      els.bearBubu.addEventListener("click", function () { pickRole("bubu"); });
      els.bearDudu.addEventListener("click", function () { pickRole("dudu"); });
      els.readyBtn.addEventListener("click", pressReady);
      els.choices.addEventListener("click", function (event) {
        const btn = event.target.closest("button[data-id]");
        if (!btn || btn.disabled) return;
        choose(btn.dataset.id);
      });
      els.continueBtn.addEventListener("click", pressContinue);
      els.restartBtn.addEventListener("click", pressRestart);
      els.leaveBtn.addEventListener("click", leaveRoom);
      els.downBtn.addEventListener("click", function () {
        state = initialState();
        render();
      });
      els.langTr.addEventListener("click", function () { setLang("tr"); });
      els.langDe.addEventListener("click", function () { setLang("de"); });

      function setLang(next) {
        if ((next !== "tr" && next !== "de") || next === lang) return;
        lang = next;
        try { localStorage.setItem("bd-lang", lang); } catch (err) { /* storage kapalı */ }
        render();
      }

      render();
    }());
  </script>
</body>
</html>
